name: pull-request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ".nvmrc"
          cache: npm

      # npm 12 を同梱する Node がまだ無いため明示的に入れる。
      # .npmrc と engines が npm 12 前提なので、無いと npm ci が EBADENGINE で落ちる
      - run: npm install -g npm@12

      - run: npm ci

      - run: npm run sync
      - name: Verify templates are in sync
        run: git diff --exit-code

      - run: npm run check
      - name: Verify lint and format produce no changes
        run: git diff --exit-code

      - run: npm run build
