name: sync-templates

on:
  push:
    branches: [main]
    paths:
      - "builder/**"
      - "scripts/sync-templates.mjs"
      - ".github/workflows/sync-templates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - run: npm ci

      # The sync script cleans each template dir before regenerating it.
      - run: npm run sync
      - run: npm run check

      - run: npm run build

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync templates from builder/"
            git push
          else
            echo "No changes."
          fi
