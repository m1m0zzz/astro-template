name: sync-templates

on:
  push:
    branches: [main]
    paths:
      - "builder/**"
      - "scripts/sync-templates.mjs"
      - ".github/workflows/sync-templates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ".nvmrc"
          cache: npm

      # npm 12 を同梱する Node がまだ無いため明示的に入れる。
      # .npmrc と engines が npm 12 前提なので、無いと npm ci が EBADENGINE で落ちる
      - run: npm install -g npm@12

      - run: npm ci

      # The sync script cleans each template dir before regenerating it.
      - run: npm run sync
      - run: npm run check

      - run: npm run build

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync templates from builder/"
            git push
          else
            echo "No changes."
          fi
